name: agent
on:
  push: { paths: ["agent/**"] }
  pull_request: { paths: ["agent/**"] }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: agent } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: go mod tidy
      - run: go vet ./...
      - run: GOOS=windows GOARCH=amd64 go build -o bin/agent.exe ./cmd/agent
      - run: GOOS=linux GOARCH=amd64 go build -o bin/agent ./cmd/agent
