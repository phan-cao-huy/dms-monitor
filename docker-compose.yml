services:
  db:
    image: postgres:15
    restart: unless-stopped
    env_file: .env
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/dms01.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  backup:
    image: postgres:15
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "/ops/backup.sh"]
    volumes:
      - ./ops/backup.sh:/ops/backup.sh:ro
      - ${DMS_BACKUP_DIR:-../dms-backups}:/archives
      - backup_state:/state

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
      - path: .password-reset.env.local
        required: false
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    environment:
      EMBEDDED_WORKER: "false"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - backup_state:/run/dms-backup:ro
      - ./backend:/code
      - type: volume
        source: pgdata
        target: /run/dms-db-volume
        read_only: true
        volume:
          subpath: pg_stat_tmp

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - type: volume
        source: pgdata
        target: /run/dms-db-volume
        read_only: true
        volume:
          subpath: pg_stat_tmp
    command: python -m app.workers.runner

volumes:
  backup_state:
  pgdata:
