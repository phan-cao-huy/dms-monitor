services:
  db:
    image: postgres:15
    restart: unless-stopped
    env_file: .env
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/dms01.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes: ["./backend:/code"]

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    command: python -m app.workers.runner

volumes:
  pgdata:
